[project]
name = "genret"
version = "0.1.0"
description = "Generative Retrieval with T5"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.4.0",
    "sae-lens>=5.0.0",
    "transformer-lens>=2.0.0",
    "datasets>=2.19.0",
    "safetensors>=0.4.0",
    "k-means-constrained>=0.7.3",
    "faiss-cpu>=1.11.0",
    "wandb>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
